<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="setup-mode" content="__SETUP_MODE__" />
  <meta name="admin-path" content="__ADMIN_PATH__" />
  <title>Acesso Privado — Estúdio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/portfolio.css" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card liquid-glass">
      <div class="auth-header">
        <span class="brand-mark">PD</span>
        <div>
          <div style="font-size:14px;font-weight:500;">Pedro Daniel Studio</div>
          <div style="font-size:12px;color:var(--text-muted);">Área administrativa protegida</div>
        </div>
      </div>

      <h1 id="auth-title" class="auth-title">Entrar no painel</h1>
      <p id="auth-sub" class="auth-sub">Autenticação protegida por sessão HttpOnly e proteção contra força bruta.</p>

      <div id="auth-error" class="auth-error" role="alert"></div>

      <form id="auth-form" style="display:grid;gap:16px;" autocomplete="on">
        <div class="field">
          <label for="email">E-mail administrativo</label>
          <input id="email" name="email" type="email" class="input" required placeholder="Pedrodanielbonfa@gmail.com" autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" class="input" required autocomplete="current-password" />
        </div>

        <div id="confirm-wrap" class="field" style="display:none;">
          <label for="confirm-password">Confirmar senha (mínimo 10 caracteres)</label>
          <input id="confirm-password" name="confirm" type="password" class="input" autocomplete="new-password" />
        </div>

        <label id="remember-wrap" class="check-row">
          <input id="remember" type="checkbox" />
          <span>Manter conectado por 7 dias neste dispositivo</span>
        </label>

        <button id="submit-btn" type="submit" class="btn btn-primary" style="width:100%;height:42px;">
          Entrar
        </button>
      </form>

      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-muted);">
        <a href="/" style="color:var(--text-secondary);">Voltar ao portfólio</a>
        <span class="mono">scrypt + CSRF</span>
      </div>
    </section>
  </main>

  <script type="module" src="/static/js/admin-login.js"></script>
</body>
</html>
